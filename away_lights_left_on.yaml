# Away Presence - Lights Left On Alert & Remote Off
# Version: 1.2.0
# Updated: 2026-08-29

blueprint:
  name: Away Presence - Lights Left On Alert & Remote Off v1.2.0
  description: >
    Checks selected presence sensors to determine when people are away.
    After a configurable delay, checks for non-ignored lights that are still on
    and sends a mobile notification with a button to turn them off.
    Supports multiple presence sensors, ALL/ANY logic, inverted sensors,
    ignored lights, and configurable repeat reminders.
  domain: automation

  input:

    presence_entities:
      name: Presence sensors
      description: >
        Select one or more presence binary sensors.
        Normally OFF means away.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor

    presence_logic:
      name: Presence logic
      description: >
        ALL requires every selected presence sensor to indicate away.
        ANY requires only one selected sensor to indicate away.
      default: all
      selector:
        select:
          options:
            - label: "ALL - everyone must be away"
              value: all
            - label: "ANY - one sensor being away is enough"
              value: any

    inverted_presence_entities:
      name: Inverted presence sensors
      description: >
        Optional. Select any of the presence sensors above where ON means
        away instead of OFF.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor

    ignored_lights:
      name: Ignored lights
      description: Select lights that should not trigger the away warning.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light

    initial_delay:
      name: Initial delay
      description: >
        How long to wait after the presence condition becomes true
        before checking the lights.
      default:
        hours: 0
        minutes: 0
        seconds: 30
      selector:
        duration:

    repeat_interval:
      name: Repeat check interval
      description: >
        How long to wait between repeated checks.
        Set hours, minutes and seconds to 0 to disable repeated checks.
      default:
        hours: 1
        minutes: 0
        seconds: 0
      selector:
        duration:

    notify_device:
      name: Device to notify
      description: >
        Select the phone or tablet running the Home Assistant Companion App.
      selector:
        device:
          filter:
            - integration: mobile_app


variables:
  presence_entities: !input presence_entities
  presence_logic: !input presence_logic
  inverted_presence_entities: !input inverted_presence_entities
  ignored_lights: !input ignored_lights
  repeat_interval: !input repeat_interval

  repeat_interval_seconds: >
    {{
      (repeat_interval.get('hours', 0) | int * 3600)
      + (repeat_interval.get('minutes', 0) | int * 60)
      + (repeat_interval.get('seconds', 0) | int)
    }}

  notification_action: >
    LSWITCHOFF_{{ this.entity_id | replace('.', '_') }}


triggers:

  - trigger: state
    entity_id: !input presence_entities
    id: PresenceChanged

  - trigger: event
    event_type: mobile_app_notification_action
    id: Response


conditions: []


actions:
  - choose:

      # =========================================================
      # PRESENCE CHANGED
      # =========================================================
      - conditions:

          - condition: trigger
            id: PresenceChanged

          - condition: template
            value_template: >
              {% set ns = namespace(away_count=0) %}

              {% for entity in presence_entities %}
                {% if entity in inverted_presence_entities %}
                  {% set entity_is_away = is_state(entity, 'on') %}
                {% else %}
                  {% set entity_is_away = is_state(entity, 'off') %}
                {% endif %}

                {% if entity_is_away %}
                  {% set ns.away_count = ns.away_count + 1 %}
                {% endif %}
              {% endfor %}

              {% if presence_logic == 'all' %}
                {{
                  presence_entities | count > 0
                  and ns.away_count == presence_entities | count
                }}
              {% else %}
                {{ ns.away_count > 0 }}
              {% endif %}

        sequence:

          # Initial delay
          - delay: !input initial_delay

          # Recheck presence after delay
          - condition: template
            value_template: >
              {% set ns = namespace(away_count=0) %}

              {% for entity in presence_entities %}
                {% if entity in inverted_presence_entities %}
                  {% set entity_is_away = is_state(entity, 'on') %}
                {% else %}
                  {% set entity_is_away = is_state(entity, 'off') %}
                {% endif %}

                {% if entity_is_away %}
                  {% set ns.away_count = ns.away_count + 1 %}
                {% endif %}
              {% endfor %}

              {% if presence_logic == 'all' %}
                {{
                  presence_entities | count > 0
                  and ns.away_count == presence_entities | count
                }}
              {% else %}
                {{ ns.away_count > 0 }}
              {% endif %}

          # Check for non-ignored lights
          - condition: template
            value_template: >
              {{
                states.light
                | selectattr('state', 'eq', 'on')
                | rejectattr('entity_id', 'in', ignored_lights)
                | list
                | count > 0
              }}

          # Initial notification
          - device_id: !input notify_device
            domain: mobile_app
            type: notify

            title: >
              There are {{
                states.light
                | selectattr('state', 'eq', 'on')
                | rejectattr('entity_id', 'in', ignored_lights)
                | list
                | count
              }} lights on

            message: >
              {{
                states.light
                | selectattr('state', 'eq', 'on')
                | rejectattr('entity_id', 'in', ignored_lights)
                | map(attribute='name')
                | list
                | join(', ')
              }}

            data:
              actions:
                - action: "{{ notification_action }}"
                  title: Turn Off
                  authenticationRequired: false
                  icon: sfsymbols:lightbulb.2


          # =======================================================
          # REPEAT WHILE AWAY
          # =======================================================
          - repeat:
              while:

                # All zero disables repeats
                - condition: template
                  value_template: >
                    {{ repeat_interval_seconds | int > 0 }}

                # Still away?
                - condition: template
                  value_template: >
                    {% set ns = namespace(away_count=0) %}

                    {% for entity in presence_entities %}
                      {% if entity in inverted_presence_entities %}
                        {% set entity_is_away = is_state(entity, 'on') %}
                      {% else %}
                        {% set entity_is_away = is_state(entity, 'off') %}
                      {% endif %}

                      {% if entity_is_away %}
                        {% set ns.away_count = ns.away_count + 1 %}
                      {% endif %}
                    {% endfor %}

                    {% if presence_logic == 'all' %}
                      {{
                        presence_entities | count > 0
                        and ns.away_count == presence_entities | count
                      }}
                    {% else %}
                      {{ ns.away_count > 0 }}
                    {% endif %}

                # Still have lights on?
                - condition: template
                  value_template: >
                    {{
                      states.light
                      | selectattr('state', 'eq', 'on')
                      | rejectattr('entity_id', 'in', ignored_lights)
                      | list
                      | count > 0
                    }}

              sequence:

                - delay: !input repeat_interval

                # Recheck presence after waiting
                - condition: template
                  value_template: >
                    {% set ns = namespace(away_count=0) %}

                    {% for entity in presence_entities %}
                      {% if entity in inverted_presence_entities %}
                        {% set entity_is_away = is_state(entity, 'on') %}
                      {% else %}
                        {% set entity_is_away = is_state(entity, 'off') %}
                      {% endif %}

                      {% if entity_is_away %}
                        {% set ns.away_count = ns.away_count + 1 %}
                      {% endif %}
                    {% endfor %}

                    {% if presence_logic == 'all' %}
                      {{
                        presence_entities | count > 0
                        and ns.away_count == presence_entities | count
                      }}
                    {% else %}
                      {{ ns.away_count > 0 }}
                    {% endif %}

                # Recheck lights
                - condition: template
                  value_template: >
                    {{
                      states.light
                      | selectattr('state', 'eq', 'on')
                      | rejectattr('entity_id', 'in', ignored_lights)
                      | list
                      | count > 0
                    }}

                # Repeat notification
                - device_id: !input notify_device
                  domain: mobile_app
                  type: notify

                  title: >
                    There are {{
                      states.light
                      | selectattr('state', 'eq', 'on')
                      | rejectattr('entity_id', 'in', ignored_lights)
                      | list
                      | count
                    }} lights still on

                  message: >
                    {{
                      states.light
                      | selectattr('state', 'eq', 'on')
                      | rejectattr('entity_id', 'in', ignored_lights)
                      | map(attribute='name')
                      | list
                      | join(', ')
                    }}

                  data:
                    actions:
                      - action: "{{ notification_action }}"
                        title: Turn Off
                        authenticationRequired: false
                        icon: sfsymbols:lightbulb.2


      # =========================================================
      # TURN OFF BUTTON PRESSED
      # =========================================================
      - conditions:

          - condition: trigger
            id: Response

          - condition: template
            value_template: >
              {{ trigger.event.data.action == notification_action }}

        sequence:

          - action: light.turn_off
            target:
              entity_id: >
                {{
                  states.light
                  | selectattr('state', 'eq', 'on')
                  | rejectattr('entity_id', 'in', ignored_lights)
                  | map(attribute='entity_id')
                  | list
                }}


mode: restart
max_exceeded: silent