blueprint:
  name: "YAMA - Yet Another Motion Automation V10.11"
  description: >
    # YAMA V10.11

    Local maintenance update based on Networkingcat's YAMA V10.

    Changes from V10:
    - Removes the fake optional-scene placeholder that Spook reports as a missing entity.
    - Optional scene inputs now use an empty value when no scene is selected.
    - Keeps YAMA's original scene action syntax for compatibility.
    - Allows the motion-off path to run even if the automation blocker or sun
      elevation condition changes after the lights were switched on.

    Turn on lights or scenes when motion is detected.
    Four different scenes can be defined depending on time of day.
  domain: automation

  input:
    motion_entity:
      name: Motion Sensor
      description: Motion Sensor or a group with Motion Sensors (can be anything switching between "on" and "off").
      selector:
        entity: {}

    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light

    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds

    automation_blocker:
      name: Automation Blocker (Optional)
      description: Only allow motion-on if this entity is in the desired state.
      default:
      selector:
        entity: {}

    automation_blocker_boolean:
      name: Automation Blocker Chooser (Optional)
      description: Desired state of automation blocker. On = blocker must be on; Off = blocker must be off.
      default: false
      selector:
        boolean: {}

    no_motion_blocker:
      name: No Motion Blocker (Optional)
      description: No-motion sequence follows the original YAMA V10 blocker behaviour.
      default:
      selector:
        entity: {}

    no_motion_blocker_boolean:
      name: No Motion Chooser (Optional)
      description: Desired state of no-motion blocker, as used by original YAMA V10.
      default: false
      selector:
        boolean: {}

    elevation_check:
      name: Sun elevation check (Optional)
      description: This is the angle between the sun and the horizon. Negative values mean the sun is below the horizon.
      default:
      selector:
        number:
          min: -90
          max: 90
          unit_of_measurement: degrees

    scene_ambient:
      name: Ambient Scene (Optional)
      description: Scene for ambient state. Will be activated when no motion is detected.
      default:
      selector:
        entity:
          domain: scene

    time_scene_ambient_start:
      name: Ambient time frame start (Optional)
      description: Time from which the ambient scene will be activated.
      default: "00:00:00"
      selector:
        time: {}

    time_scene_ambient_end:
      name: Ambient time frame end (Optional)
      description: Time from which the ambient scene will no longer be activated.
      default: "00:00:00"
      selector:
        time: {}

    scene_morning:
      name: Scene for the morning (Optional)
      default:
      selector:
        entity:
          domain: scene

    time_scene_morning:
      name: Time for the morning scene (Optional)
      description: Time from which the morning scene will be activated if motion is detected.
      default: "00:00:00"
      selector:
        time: {}

    scene_day:
      name: Scene for the bright day (Optional)
      default:
      selector:
        entity:
          domain: scene

    time_scene_day:
      name: Time for the day scene (Optional)
      description: Time from which the day scene will be activated if motion is detected.
      default: "00:00:00"
      selector:
        time: {}

    scene_evening:
      name: Scene for the evening (Optional)
      default:
      selector:
        entity:
          domain: scene

    time_scene_evening:
      name: Time for the evening scene (Optional)
      description: Time from which the evening scene will be activated if motion is detected.
      default: "00:00:00"
      selector:
        time: {}

    scene_night:
      name: Scene for the dark night (Optional)
      default:
      selector:
        entity:
          domain: scene

    time_scene_night:
      name: Time for the night scene (Optional)
      description: Time from which the night scene will be activated if motion is detected.
      default: "00:00:00"
      selector:
        time: {}

    scene_no_motion:
      name: Default scene for no motion (Optional)
      description: Set this scene if you want to activate a scene when motion stops instead of turning the light target off.
      default:
      selector:
        entity:
          domain: scene

mode: restart
max_exceeded: silent

variables:
  scene_ambient: !input scene_ambient
  scene_morning: !input scene_morning
  scene_day: !input scene_day
  scene_evening: !input scene_evening
  scene_night: !input scene_night
  automation_blocker: !input automation_blocker
  automation_blocker_boolean: !input automation_blocker_boolean
  no_motion_blocker: !input no_motion_blocker
  no_motion_blocker_boolean: !input no_motion_blocker_boolean
  elevation_check: !input elevation_check
  scene_no_motion: !input scene_no_motion

trigger:
  - platform: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"
    id: motion_on

  - platform: state
    entity_id: !input motion_entity
    from: "on"
    to: "off"
    for: !input no_motion_wait
    id: motion_off

condition:
  # Apply blocker only when motion turns ON. Always permit the OFF path.
  - alias: Automation blocker allows motion-on, or this is the motion-off path
    condition: template
    value_template: >-
      {{
        trigger.id == 'motion_off'
        or automation_blocker == none
        or automation_blocker == ''
        or (automation_blocker_boolean and is_state(automation_blocker, 'on'))
        or (not automation_blocker_boolean and is_state(automation_blocker, 'off'))
      }}

  # Apply sun elevation only when motion turns ON. Always permit the OFF path.
  - alias: Sun elevation allows motion-on, or this is the motion-off path
    condition: template
    value_template: >-
      {{
        trigger.id == 'motion_off'
        or elevation_check == none
        or (state_attr('sun.sun', 'elevation') | float(90)) <= (elevation_check | float(90))
      }}

action:
  - choose:
      ######################################################################
      # MOTION ON
      ######################################################################
      - alias: Motion detected
        conditions:
          - condition: trigger
            id: motion_on
        sequence:
          - choose:
              - alias: Morning scene
                conditions:
                  - alias: Morning scene is configured
                    condition: template
                    value_template: "{{ scene_morning not in [none, ''] }}"
                  - condition: time
                    after: !input time_scene_morning
                    before: !input time_scene_day
                sequence:
                  - scene: !input scene_morning

              - alias: Day scene
                conditions:
                  - alias: Day scene is configured
                    condition: template
                    value_template: "{{ scene_day not in [none, ''] }}"
                  - condition: time
                    after: !input time_scene_day
                    before: !input time_scene_evening
                sequence:
                  - scene: !input scene_day

              - alias: Evening scene
                conditions:
                  - alias: Evening scene is configured
                    condition: template
                    value_template: "{{ scene_evening not in [none, ''] }}"
                  - condition: time
                    after: !input time_scene_evening
                    before: !input time_scene_night
                sequence:
                  - scene: !input scene_evening

              - alias: Night scene
                conditions:
                  - alias: Night scene is configured
                    condition: template
                    value_template: "{{ scene_night not in [none, ''] }}"
                  - condition: time
                    after: !input time_scene_night
                    before: !input time_scene_morning
                sequence:
                  - scene: !input scene_night

            default:
              - service: light.turn_on
                target: !input light_target

      ######################################################################
      # MOTION OFF
      ######################################################################
      - alias: Motion cleared
        conditions:
          - condition: trigger
            id: motion_off

          # Retain original YAMA V10 no-motion-blocker semantics.
          - alias: No-motion blocker permits the no-motion sequence
            condition: template
            value_template: >-
              {{
                no_motion_blocker == none
                or no_motion_blocker == ''
                or (no_motion_blocker_boolean and is_state(no_motion_blocker, 'on'))
                or (not no_motion_blocker_boolean and is_state(no_motion_blocker, 'off'))
              }}

        sequence:
          - choose:
              - alias: Ambient scene
                conditions:
                  - alias: Ambient scene is configured
                    condition: template
                    value_template: "{{ scene_ambient not in [none, ''] }}"
                  - condition: time
                    after: !input time_scene_ambient_start
                    before: !input time_scene_ambient_end
                sequence:
                  - scene: !input scene_ambient

              - alias: Default no-motion scene
                conditions:
                  - alias: No-motion scene is configured
                    condition: template
                    value_template: "{{ scene_no_motion not in [none, ''] }}"
                sequence:
                  - scene: !input scene_no_motion

            default:
              - service: light.turn_off
                target: !input light_target
